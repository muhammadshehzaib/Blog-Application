<!DOCTYPE html>
<html>
<head>
  <title>Live Comments Test</title>
  <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
  <style>
    body { font-family: sans-serif; max-width: 700px; margin: 40px auto; }
    #log { border: 1px solid #ccc; padding: 12px; min-height: 200px; }
    .comment { padding: 6px; border-bottom: 1px solid #eee; }
    input, button { padding: 8px; font-size: 14px; }
  </style>
</head>
<body>
  <h1>Live Comments</h1>
  <p>
    Post ID:
    <input id="postId" placeholder="paste a blog _id here" size="30" />
    <button onclick="join()">Listen for comments on this post</button>
  </p>
  <p id="status">Not connected</p>
  <div id="log"></div>

  <script>
    const socket = io('http://localhost:3002');

    socket.on('connect', () => {
      document.getElementById('status').textContent =
        'Connected. Socket id: ' + socket.id;
    });

    socket.on('disconnect', () => {
      document.getElementById('status').textContent = 'Disconnected';
    });

    socket.on('commentCreated', (comment) => {
      const div = document.createElement('div');
      div.className = 'comment';
      div.textContent =
        new Date().toLocaleTimeString() + '  —  ' + JSON.stringify(comment);
      document.getElementById('log').prepend(div);
    });

    function join() {
      const postId = document.getElementById('postId').value.trim();
      if (!postId) return alert('Enter a post id');
      socket.emit('joinPost', postId, (ack) => {
        document.getElementById('status').textContent =
          'Listening on post: ' + postId;
      });
    }
  </script>
</body>
</html>
